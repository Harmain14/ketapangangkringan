    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* PRINT SPECIFIC STYLES - THERMAL RECEIPT 58mm / 80mm */
        @media print {
            /* Hide every single UI element on screen */
            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
            }

            body * {
                visibility: hidden !important;
                display: none !important;
            }

            /* Unhide and display ONLY the printable receipt block */
            #printable-receipt, #printable-receipt * {
                visibility: visible !important;
                display: block !important;
            }

            #printable-receipt {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 80mm !important; /* Standard 80mm receipt width */
                max-width: 100% !important;
                padding: 5px 10px !important;
                margin: 0 auto !important;
                font-family: 'Inconsolata', 'Courier New', Courier, monospace !important;
                font-size: 12px !important;
                line-height: 1.3 !important;
                color: #000000 !important;
                background: #ffffff !important;
            }

            /* Inline utilities for printable thermal layout */
            #printable-receipt .print-flex {
                display: flex !important;
                justify-content: space-between !important;
            }
            #printable-receipt .print-center {
                text-align: center !important;
            }
            #printable-receipt .print-right {
                text-align: right !important;
            }
            #printable-receipt .print-bold {
                font-weight: 700 !important;
            }
            #printable-receipt .print-divider {
                border-top: 1px dashed #000000 !important;
                margin: 6px 0 !important;
            }
        }
    </style>
</head>
<body class="bg-stone-100 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

        </div>
    </header>

    <!-- Main Content Grid -->

            { id: 1002, name: "Avocado Frappe", price: 15000, category: "Frappe / Cloudy", icon: "fa-whiskey-glass" },
            { id: 1003, name: "Matcha Frappe", price: 17000, category: "Frappe / Cloudy", icon: "fa-whiskey-glass" }

        const categories = ["Semua", "Makanan", "Mie", "Snack / Cemilan", "Rebusan", "Jus", "Es / Hot", "Soda", "Coffee", "Chocolate Blend", "Frappe / Cloudy"];

        let cart = [];
        let activeCategory = "Semua";
        let paymentMethod = "cash";
        let transactionHistory = JSON.parse(localStorage.getItem('ketapang_pos_history') || '[]');
        let lastTransaction = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderMenu();
            renderCart();
        });

        function formatRp(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                    class="px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                        activeCategory === cat 
                        ? 'bg-brand-800 text-amber-300 shadow-sm' 
                        : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                    }">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = menuData.filter(item => {
                const matchCategory = activeCategory === "Semua" || item.category === activeCategory;
                const matchSearch = item.name.toLowerCase().includes(searchVal);
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-stone-400">
                        <i class="fa-solid fa-utensils text-3xl mb-2 text-stone-300"></i>
                        <p class="text-sm">Menu tidak ditemukan</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const inCart = cart.find(c => c.id === item.id);
                const qty = inCart ? inCart.qty : 0;

                return `
                    <div onclick="addToCart(${item.id})" class="bg-white p-3.5 rounded-2xl border border-stone-200/80 hover:border-brand-500/50 hover:shadow-md transition cursor-pointer flex flex-col justify-between relative group">
                        ${qty > 0 ? `
                            <span class="absolute -top-2 -right-2 bg-amber-500 text-slate-900 font-extrabold text-[11px] w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow">
                                ${qty}
                            </span>
                        ` : ''}
                        <div>
                            <div class="w-8 h-8 rounded-lg bg-brand-50 text-brand-700 flex items-center justify-center mb-2.5 group-hover:scale-110 transition-transform">
                                <i class="fa-solid ${item.icon}"></i>
                            </div>
                            <h3 class="font-bold text-slate-800 text-xs sm:text-sm leading-snug line-clamp-2">${item.name}</h3>
                            <p class="text-[10px] text-stone-400 mt-0.5">${item.category}</p>
                        </div>
                        <div class="mt-3 flex items-center justify-between">
                            <span class="text-xs font-bold text-brand-800">${formatRp(item.price)}</span>
                            <div class="w-6 h-6 rounded-full bg-stone-100 group-hover:bg-brand-700 group-hover:text-white flex items-center justify-center text-stone-600 transition">
                                <i class="fa-solid fa-plus text-[10px]"></i>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterMenu() {
            renderMenu();
        }

        // Cart Actions
        function addToCart(id) {
            const item = menuData.find(m => m.id === id);
            if (!item) return;

            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }

            renderCart();
            renderMenu();
            showToast(`Menambahkan ${item.name}`);
        }

        function updateQty(id, delta) {
            const existing = cart.find(c => c.id === id);
            if (!existing) return;

            existing.qty += delta;
            if (existing.qty <= 0) {
                cart = cart.filter(c => c.id !== id);
            }

            renderCart();
            renderMenu();
        }

        function removeFromCart(id) {
            cart = cart.filter(c => c.id !== id);
            renderCart();
            renderMenu();
        }

        function clearCart() {
            if (cart.length === 0) return;
            cart = [];
            renderCart();
            renderMenu();
            showToast("Keranjang dikosongkan");
        }

        function getTotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            const subtotalText = document.getElementById('subtotalText');
            const totalText = document.getElementById('totalText');
            const btnCheckout = document.getElementById('btnCheckout');
            const btnPreview = document.getElementById('btnPreview');

            const total = getTotal();

            if (cart.length === 0) {
                emptyCart.classList.remove('hidden');
                container.innerHTML = '';
                container.appendChild(emptyCart);
                subtotalText.innerText = "Rp 0";
                totalText.innerText = "Rp 0";
                btnCheckout.disabled = true;
                btnPreview.disabled = true;
                calculateChange();
                return;
            }

            emptyCart.classList.add('hidden');
            container.innerHTML = cart.map(item => `
                <div class="py-2.5 flex items-center justify-between gap-2">
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-bold text-slate-800 truncate">${item.name}</p>
                        <p class="text-[11px] text-stone-500">${formatRp(item.price)} x ${item.qty} = <span class="font-semibold text-slate-700">${formatRp(item.price * item.qty)}</span></p>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 rounded-md bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-xs flex items-center justify-center transition">
                            <i class="fa-solid fa-minus text-[10px]"></i>
                        </button>
                        <span class="text-xs font-bold w-5 text-center">${item.qty}</span>
                        <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 rounded-md bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-xs flex items-center justify-center transition">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                        </button>
                        <button onclick="removeFromCart(${item.id})" class="w-6 h-6 rounded-md bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs flex items-center justify-center ml-1 transition">
                            <i class="fa-solid fa-xmark text-[11px]"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            subtotalText.innerText = formatRp(total);
            totalText.innerText = formatRp(total);
            btnCheckout.disabled = false;
            btnPreview.disabled = false;

            calculateChange();
        }

        function setPaymentMethod(method) {
            paymentMethod = method;
            const cashBtn = document.getElementById('btnMethodCash');
            const qrisBtn = document.getElementById('btnMethodQris');
            const transferBtn = document.getElementById('btnMethodTransfer');
            const cashArea = document.getElementById('cashCalculationArea');

            [cashBtn, qrisBtn, transferBtn].forEach(btn => {
                btn.className = "py-1.5 px-2 text-xs font-semibold rounded-lg border border-stone-200 bg-white text-stone-600 hover:bg-stone-50 flex items-center justify-center gap-1 transition";
            });

            if (method === 'cash') {
                cashBtn.className = "py-1.5 px-2 text-xs font-semibold rounded-lg border border-brand-700 bg-brand-50 text-brand-800 flex items-center justify-center gap-1 transition";
                cashArea.classList.remove('hidden');
            } else {
                const targetBtn = method === 'qris' ? qrisBtn : transferBtn;
                targetBtn.className = "py-1.5 px-2 text-xs font-semibold rounded-lg border border-brand-700 bg-brand-50 text-brand-800 flex items-center justify-center gap-1 transition";
                cashArea.classList.add('hidden');
            }
        }

        function calculateChange() {
            const total = getTotal();
            const payInput = document.getElementById('payAmount');
            const changeText = document.getElementById('changeText');

            if (paymentMethod !== 'cash') return;

            const paid = parseFloat(payInput.value) || 0;
            const change = paid - total;

            if (paid === 0 || cart.length === 0) {
                changeText.innerText = "Rp 0";
                changeText.className = "w-full px-3 py-1.5 bg-stone-100 border border-stone-200 rounded-lg text-sm font-bold text-slate-700 flex items-center";
                return;
            }

            if (change < 0) {
                changeText.innerText = `Kurang: ${formatRp(Math.abs(change))}`;
                changeText.className = "w-full px-3 py-1.5 bg-rose-50 border border-rose-200 rounded-lg text-sm font-bold text-rose-600 flex items-center";
            } else {
                changeText.innerText = formatRp(change);
                changeText.className = "w-full px-3 py-1.5 bg-emerald-50 border border-emerald-200 rounded-lg text-sm font-bold text-emerald-600 flex items-center";
            }
        }

        function setQuickCash(amount) {
            const payInput = document.getElementById('payAmount');
            const total = getTotal();

            if (amount === 'exact') {
                payInput.value = total;
            } else {
                payInput.value = amount;
            }
            calculateChange();
        }

        // Checkout & Print Engine
        function processCheckout(autoPrint = true) {
            if (cart.length === 0) return;

            const total = getTotal();
            const customerName = document.getElementById('customerName').value.trim() || 'Pelanggan Umum';
            const tableNo = document.getElementById('tableNo').value.trim() || '-';
            const payInput = document.getElementById('payAmount');
            
            let paidAmount = total;
            let changeAmount = 0;

            if (paymentMethod === 'cash') {
                paidAmount = parseFloat(payInput.value) || 0;
                if (paidAmount < total) {
                    showToast("Jumlah pembayaran tunai kurang!", "error");
                    return;
                }
                changeAmount = paidAmount - total;
            }

            const transactionData = {
                id: 'TRX-' + Date.now().toString().slice(-6),
                date: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
                customer: customerName,
                table: tableNo,
                items: [...cart],
                subtotal: total,
                total: total,
                paymentMethod: paymentMethod.toUpperCase(),
                paid: paidAmount,
                change: changeAmount
            };

            lastTransaction = transactionData;

            // Save transaction
            transactionHistory.unshift(transactionData);
            localStorage.setItem('ketapang_pos_history', JSON.stringify(transactionHistory));

            // Generate Layouts
            generateReceipts(transactionData);

            if (autoPrint) {
                // Trigger Direct Window Print
                setTimeout(() => {
                    window.print();
                }, 100);
            } else {
                // Open Preview Modal Only
                document.getElementById('receiptModal').classList.remove('hidden');
            }
        }

        // Generate Receipts Layouts for Screen Preview and Print Template
        function generateReceipts(trx) {
            // Screen Modal HTML Layout
            const screenItemsHtml = trx.items.map(item => `
                <div class="flex justify-between py-0.5">
                    <span class="flex-1">${item.name} x${item.qty}</span>
                    <span>${formatRp(item.price * item.qty)}</span>
                </div>
            `).join('');

            const screenReceiptHtml = `
                <div class="text-center pb-2 border-b border-dashed border-stone-300">
                    <img src="logo warna fix.png">
                    <p class="text-[10px] text-stone-500 leading-tight mt-0.5">
                        Dusun Ketapang, Desa Gegerung,<br>
                        Kec. Lingsar, Kab. Lombok Barat<br>
                        IG: @ketapangangkringan
                    </p>
                </div>

                <div class="py-2 border-b border-dashed border-stone-300 text-[11px] space-y-0.5">
                    <div class="flex justify-between"><span>No. Nota:</span> <span>${trx.id}</span></div>
                    <div class="flex justify-between"><span>Tanggal:</span> <span>${trx.date}</span></div>
                    <div class="flex justify-between"><span>Pelanggan:</span> <span>${trx.customer}</span></div>
                    <div class="flex justify-between"><span>Meja/Tipe:</span> <span>${trx.table}</span></div>
                </div>

                <div class="py-2 border-b border-dashed border-stone-300 text-[11px]">
                    ${screenItemsHtml}
                </div>

                <div class="py-2 border-b border-dashed border-stone-300 text-[11px] space-y-1">
                    <div class="flex justify-between font-bold">
                        <span>TOTAL:</span>
                        <span>${formatRp(trx.total)}</span>
                    </div>
                    <div class="flex justify-between text-stone-600">
                        <span>Metode Bayar:</span>
                        <span>${trx.paymentMethod}</span>
                    </div>
                    <div class="flex justify-between text-stone-600">
                        <span>Bayar:</span>
                        <span>${formatRp(trx.paid)}</span>
                    </div>
                    <div class="flex justify-between text-stone-600">
                        <span>Kembali:</span>
                        <span>${formatRp(trx.change)}</span>
                    </div>
                </div>

                <div class="text-center pt-2 text-[10px] text-stone-500">
                    <p class="font-medium">Matur Sumpung / Terima Kasih!</p>
                    <p>Enak Rasa, Damai Suasana</p>
                </div>
            `;

            document.getElementById('receiptContent').innerHTML = screenReceiptHtml;

            // Strict Print HTML Layout
            const printItemsHtml = trx.items.map(item => `
                <div class="print-flex">
                    <span>${item.name} x${item.qty}</span>
                    <span>${formatRp(item.price * item.qty)}</span>
                </div>
            `).join('');

            const printReceiptHtml = `
                <div class="print-center">
                    <div class="print-bold" style="font-size:14px; text-transform:uppercase;">Ketapang Angkringan</div>
                    <div>Dusun Ketapang, Desa Gegerung</div>
                    <div>Kec. Lingsar, Kab. Lombok Barat</div>
                    <div>IG: @ketapangangkringan</div>
                </div>
                <div class="print-divider"></div>
                <div class="print-flex"><span>No. Nota:</span> <span>${trx.id}</span></div>
                <div class="print-flex"><span>Tanggal:</span> <span>${trx.date}</span></div>
                <div class="print-flex"><span>Pelanggan:</span> <span>${trx.customer}</span></div>
                <div class="print-flex"><span>Meja/Tipe:</span> <span>${trx.table}</span></div>
                <div class="print-divider"></div>
                ${printItemsHtml}
                <div class="print-divider"></div>
                <div class="print-flex print-bold" style="font-size:13px;">
                    <span>TOTAL:</span>
                    <span>${formatRp(trx.total)}</span>
                </div>
                <div class="print-flex">
                    <span>Metode Bayar:</span>
                    <span>${trx.paymentMethod}</span>
                </div>
                <div class="print-flex">
                    <span>Bayar:</span>
                    <span>${formatRp(trx.paid)}</span>
                </div>
                <div class="print-flex">
                    <span>Kembali:</span>
                    <span>${formatRp(trx.change)}</span>
                </div>
                <div class="print-divider"></div>
                <div class="print-center" style="margin-top: 5px;">
                    <div>Matur Sumpung / Terima Kasih!</div>
                    <div style="font-style: italic;">Enak Rasa, Damai Suasana</div>
                </div>
            `;

            document.getElementById('printable-receipt').innerHTML = printReceiptHtml;
        }

        function triggerDirectPrint() {
            window.print();
        }

        function closeReceiptModal() {
            document.getElementById('receiptModal').classList.add('hidden');
        }

        function finishTransaction() {
            closeReceiptModal();
            cart = [];
            document.getElementById('payAmount').value = '';
            document.getElementById('customerName').value = 'Pelanggan Umum';
            document.getElementById('tableNo').value = 'Meja 01';
            renderCart();
            renderMenu();
            showToast("Transaksi selesai. Siap untuk transaksi berikutnya.");
        }

        // History Modal Logic
        function openHistoryModal() {
            const historyList = document.getElementById('historyList');
            
            if (transactionHistory.length === 0) {
                historyList.innerHTML = `
                    <div class="py-12 text-center text-stone-400">
                        <i class="fa-solid fa-clock-rotate-left text-3xl mb-2 text-stone-300"></i>
                        <p class="text-sm">Belum ada riwayat transaksi</p>
                    </div>
                `;
            } else {
                historyList.innerHTML = transactionHistory.map(trx => `
                    <div class="bg-stone-50 p-3 rounded-xl border border-stone-200 flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs text-slate-800">${trx.id}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-100 text-brand-800 font-semibold">${trx.paymentMethod}</span>
                            </div>
                            <p class="text-xs text-stone-500 mt-0.5">${trx.date} • ${trx.customer} (${trx.table})</p>
                            <p class="text-[11px] text-stone-600 mt-1">${trx.items.map(i => `${i.name} (${i.qty})`).join(', ')}</p>
                        </div>
                        <div class="text-right flex sm:flex-col items-center sm:items-end justify-between border-t sm:border-0 pt-2 sm:pt-0">
                            <span class="font-bold text-sm text-brand-800">${formatRp(trx.total)}</span>
                            <button onclick="reprintReceipt('${trx.id}')" class="text-xs text-brand-700 hover:text-brand-800 font-semibold flex items-center gap-1 hover:underline">
                                <i class="fa-solid fa-print"></i> Cetak Struk
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('historyModal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden');
        }

        function reprintReceipt(trxId) {
            const trx = transactionHistory.find(t => t.id === trxId);
            if (!trx) return;

            generateReceipts(trx);
            closeHistoryModal();
            setTimeout(() => {
                window.print();
            }, 100);
        }

        // Notification Toast Helper
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.innerText = message;
            
            if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
